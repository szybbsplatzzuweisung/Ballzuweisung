    if (!ghReady(c)) return false;
    try {
      const f = await ghApi('GET', ghPath(c) + '?ref=' + encodeURIComponent(c.branch));
      gh.sha = f.sha;
      const m = DATA_RE.exec(b64decode(f.content || ''));
      if (m) {
        const remote = normalizeState(JSON.parse(m[1]));
        const rj = JSON.stringify(remote);
        if (rj !== published && !isDirty()) { state = remote; published = rj; }
        else if (rj !== published) published = rj;
      }
      gh.status = 'ok';
      return true;
    } catch (e) {
      gh.status = ghErrorText(e);
      return false;
    }
  }
  async function saveGithub() {
    const c = ghConfig();
    if (!ghReady(c)) {
      ui.aTab = 'settings'; render();
      toast('Richte zuerst unten bei „Veröffentlichen auf GitHub“ die Verbindung ein.', { ms: 6000 });
      return;
    }
    ui.saving = true; renderSaveBar();
    const next = JSON.parse(JSON.stringify(state));
    next.updatedAt = new Date().toISOString();
    store.set(DRAFT_KEY, { base: state.updatedAt, at: Date.now(), state });
    try {
      if (!gh.sha) { const f = await ghApi('GET', ghPath(c) + '?ref=' + encodeURIComponent(c.branch)); gh.sha = f.sha; }
      const res = await ghApi('PUT', ghPath(c), { message: 'Tischplan aktualisiert', content: b64encode(buildDocument(next)), sha: gh.sha, branch: c.branch });
      gh.sha = res && res.content ? res.content.sha : null;
      state = normalizeState(next); published = JSON.stringify(state);
      undoStack.length = 0; store.del(DRAFT_KEY);
      ui.saving = false; gh.status = 'ok';
      render();
      toast('Veröffentlicht. Gäste sehen die Änderung in wenigen Minuten.', { ms: 6000 });
    } catch (e) {
      ui.saving = false;
      if (e.status === 409 || e.status === 422) gh.sha = null;
      renderSaveBar();
      toast(ghErrorText(e), { ms: 9000 });
    }
  }
  async function enterHostedAdmin() {
    ui.mode = 'admin'; ui.preview = false; ui.canAdmin = true;
    if (ghReady(ghConfig())) { gh.loading = true; render(); await ghLoadRemote(); gh.loading = false; }
    render();
  }
  function githubSettingsHTML() {
    const c = ghConfig();
    return `<section class="a-sec"><h2>Veröffentlichen auf GitHub</h2>
      <p class="a-lead">Damit „Speichern“ diese Seite direkt auf GitHub aktualisiert, braucht sie einmalig einen Zugangsschlüssel (Token). Er wird nur in diesem Browser auf diesem Gerät gespeichert und nie in die Seite geschrieben. Trag ihn nicht auf fremden Computern ein.</p>
      <div class="form-grid">
        <label class="field"><span>GitHub-Benutzer</span><input type="text" data-gh="owner" value="${esc(c.owner)}" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span>Repository</span><input type="text" data-gh="repo" value="${esc(c.repo)}" autocomplete="off" spellcheck="false"></label>
        <label class="field span2"><span>Token</span><input type="password" data-gh="token" value="${esc(c.token)}" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
      </div>
      <div class="btn-row" style="margin-top:12px"><button class="btn" data-act="gh-test">Verbindung testen</button>${c.token ? '<button class="btn danger" data-act="gh-forget">Token von diesem Gerät löschen</button>' : ''}</div>
      <p class="hint" id="gh-status" aria-live="polite">${gh.status === 'ok' ? 'Verbindung klappt. „Speichern“ veröffentlicht direkt auf GitHub.' : esc(gh.status)}</p>
    </section>`;
  }

  // ===================================================================
  // 10. Eingaben verarbeiten
  // ===================================================================
  function render() {
    if (ui.mode === 'admin') renderAdmin(); else renderGuest();
    renderSaveBar();
  }
  function setPath(obj, path, val) {
    const parts = path.split('.');
    let o = obj;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = val;
  }
  function addGuestFromForm() {
    const nameEl = document.getElementById('add-name');
    const name = nameEl.value.replace(/\s+/g, ' ').trim().slice(0, 120);
    if (!name) { nameEl.focus(); toast('Gib zuerst einen Namen ein.'); return; }
    const count = clamp(parseInt(document.getElementById('add-count').value, 10) || 1, 1, 50);
    const label = document.getElementById('add-table').value.trim().replace(/^tisch\s*/i, '').slice(0, 30);
    let created = false;
    ui.addTable = label;
    focusAfter = '#add-name';
    commit((s) => {
      let t = null;
      if (label) { const before = s.tables.length; t = ensureTable(s, label, curFloor().id); created = s.tables.length > before; }
      s.guests.push({ id: uid(), name, count, tableId: t ? t.id : '' });
    });
    const where = multiFloor() ? ` im Plan „${floorName(curFloor())}“` : ' im Saalplan';
    toast(created ? `${name} hinzugefügt. Tisch ${label} wurde${where} angelegt.` : `${name} hinzugefügt.`);
  }
  function applyImport(mode) {
    const { rows } = parseImport(ui.importText);
    if (!rows.length) return;
    commit((s) => {
      if (mode === 'replace') s.guests = [];
      for (const r of rows) {
        const t = r.table ? ensureTable(s, r.table, curFloor().id) : null;
        s.guests.push({ id: uid(), name: r.name, count: r.count, tableId: t ? t.id : '' });
      }
    }, { render: false });
    ui.importText = ''; ui.importOpen = false;
    render();
    toast(`${rows.length} ${rows.length === 1 ? 'Eintrag' : 'Einträge'} übernommen.`, { action: { label: 'Rückgängig', run: undo } });
  }
  function csvExport() {
    const cell = (v) => {
      let s = String(v);
      if (/^[=+\-@]/.test(s)) s = "'" + s;
      return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const rows = [['Name', 'Personen', 'Tisch']].concat(state.guests.slice().sort((a, b) => natCmp(a.name, b.name)).map((g) => [g.name, g.count, (tableById(g.tableId) || { label: '' }).label]));
    return '\ufeff' + rows.map((r) => r.map(cell).join(';')).join('\r\n') + '\r\n';
  }

  let titleTaps = [];
  async function onClick(e) {
    if (ui.mode === 'guest' && ui.adminMaybe && e.target.closest('.g-title')) {
      const now = Date.now();
      titleTaps = titleTaps.filter((t) => now - t < 3000).concat(now);
      if (titleTaps.length >= 5) { titleTaps = []; ui.mode = 'admin'; ui.preview = false; render(); return; }
    }
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id;
    switch (act) {
      // --- Gäste ---
      case 'pick':
        ui.meId = id; ui.reveal = true; ui.zoom = 1; ui.gTab = 'seat'; ui.gFloor = null;
        store.set(ME_KEY, id);
        render(); window.scrollTo(0, 0);
        break;
      case 'search-again':
        ui.meId = null; ui.query = ''; store.del(ME_KEY);
        render();
        { const q = document.getElementById('g-q'); if (q) q.focus(); }
        break;
      case 'gtab':
        ui.gTab = b.dataset.tab; ui.zoom = 1;
        render(); window.scrollTo(0, 0);
        break;
      case 'zoom': {
        const levels = [1, 1.6, 2.3, 3];
        const i = clamp(levels.indexOf(ui.zoom) + Number(b.dataset.z), 0, levels.length - 1);
        ui.zoom = levels[i];
        document.querySelectorAll('.g-plan svg').forEach((svg) => { svg.style.width = ui.zoom > 1 ? ui.zoom * 100 + '%' : ''; });
        const head = b.closest('.plan-head');
        if (head) head.querySelector('.zoom').outerHTML = zoomControls();
        centerOnHighlight();
        break;
      }
      case 'gfloor': ui.gFloor = id; render(); break;
      case 'enter-admin': ui.mode = 'admin'; ui.preview = false; render(); window.scrollTo(0, 0); break;
      case 'back-admin': ui.mode = 'admin'; ui.preview = false; render(); window.scrollTo(0, 0); break;

      // --- Verwaltung allgemein ---
      case 'atab': ui.aTab = b.dataset.tab; render(); window.scrollTo(0, 0); break;
      case 'goto':
        ui.aTab = b.dataset.tab;
        if (b.dataset.unassigned) ui.gUnassigned = true;
        if (b.dataset.sel) { ui.sel = b.dataset.sel; const it = findItem(ui.sel); if (it) ui.floor = it.item.floorId; }
        if (b.dataset.floor) { ui.floor = b.dataset.floor; ui.sel = null; }
        render(); window.scrollTo(0, 0);
        break;
      case 'preview': ui.mode = 'guest'; ui.preview = true; ui.gTab = 'seat'; render(); window.scrollTo(0, 0); break;
      case 'save': save(); break;
      case 'undo': undo(); break;
      case 'draft-restore':
        undoStack.push(JSON.stringify(state));
        state = normalizeState(ui.draft.state); ui.draft = null;
        afterChange(true); toast('Änderungen wiederhergestellt. Vergiss nicht zu speichern.');
        break;
      case 'draft-discard': ui.draft = null; store.del(DRAFT_KEY); render(); break;
      case 'demo-clear':
        commit((s) => { s.guests = []; s.program = []; s.menu = []; s.isDemo = false; });
        toast('Beispieldaten entfernt. Der Saalplan ist geblieben.', { action: { label: 'Rückgängig', run: undo } });
        break;

      // --- Gästeliste ---
      case 'add-guest': addGuestFromForm(); break;
      case 'del-guest': {
        const g = state.guests.find((x) => x.id === id);
        if (!g) break;
        commit((s) => { s.guests = s.guests.filter((x) => x.id !== id); });
        toast(`${g.name} gelöscht.`, { action: { label: 'Rückgängig', run: undo } });
        break;
      }
      case 'show-all': ui.gShowAll = true; document.getElementById('g-table').innerHTML = guestListHTML(); break;
      case 'toggle-import': ui.importOpen = !ui.importOpen; render(); if (ui.importOpen) { const t = document.getElementById('import-text'); if (t) t.focus(); } break;
      case 'import-apply':
        if (b.dataset.mode === 'replace' && !(await askConfirm('Liste ersetzen?', `Die bisherigen ${state.guests.length} Einträge werden durch die eingefügte Liste ersetzt.`, 'Ersetzen'))) break;
        applyImport(b.dataset.mode);
        break;
      case 'export-csv':
        if (await download(slug(state.event.name) + '-gaesteliste.csv', csvExport())) toast('Gästeliste heruntergeladen.');
        break;

      // --- Saalplan ---
      case 'select': ui.sel = id || null; refreshPlan(); break;
      case 'plan-add-table': {
        let t;
        commit((s) => { t = newTable(s, b.dataset.shape === 'rect' ? 'rect' : 'round', null, curFloor().id); s.tables.push(t); }, { render: false });
        ui.sel = t.id; render();
        toast(`${tableName(t)} hinzugefügt. Zieh ihn an die richtige Stelle.`);
        break;
      }
      case 'plan-add-obj': {
        const type = (document.getElementById('obj-type') || {}).value || 'other';
        const def = OBJ[type] || OBJ.other;
        let o;
        const fid = curFloor().id;
        commit((s) => { const p = findFreeSpot(s, def.w, def.h, null, fid); o = { id: uid(), type, label: '', x: p.x, y: p.y, w: def.w, h: def.h, floorId: fid }; s.objects.push(o); }, { render: false });
        ui.sel = o.id; render();
        break;
      }
      case 'plan-auto': {
        const fid = curFloor().id;
        commit((s) => {
          const ts = s.tables.filter((t) => t.floorId === fid).sort((a, b2) => natCmp(a.label, b2.label));
          for (const t of ts) { t.x = -9999; t.y = -9999; }
          for (const t of ts) { const p = findFreeSpot(s, t.w, t.h, t.id, fid); t.x = p.x; t.y = p.y; }
        });
        toast('Tische neu angeordnet.', { action: { label: 'Rückgängig', run: undo } });
        break;
      }
      case 'floor': ui.floor = id; ui.sel = null; render(); break;
      case 'floor-add': {
        const used = new Set(state.floors.map((f) => canon(f.name)));
        const name = ['Erdgeschoss', 'Obergeschoss', '2. Obergeschoss', '3. Obergeschoss', 'Keller'].find((n) => !used.has(canon(n))) || 'Geschoss ' + (state.floors.length + 1);
        const base = curFloor();
        let nf;
        commit((s) => { nf = { id: uid(), name, w: base.w, h: base.h }; s.floors.push(nf); }, { render: false });
        ui.floor = nf.id; ui.sel = null; focusAfter = '[data-floor="name"]';
        render();
        toast(`„${name}“ hinzugefügt. Den Namen kannst du gleich hier ändern.`);
        break;
      }
      case 'floor-del': {
        if (!multiFloor()) break;
        const f = curFloor();
        const ts = onFloor(state.tables, f), os = onFloor(state.objects, f);
        const ids = new Set(ts.map((t) => t.id));
        const affected = state.guests.filter((g) => ids.has(g.tableId)).length;
        const parts = [];
        if (ts.length) parts.push(ts.length === 1 ? '1 Tisch' : ts.length + ' Tische');
        if (os.length) parts.push(os.length === 1 ? '1 Bereich' : os.length + ' Bereiche');
        const text = parts.length
          ? `${parts.join(' und ')} auf diesem Plan ${ts.length + os.length === 1 ? 'wird' : 'werden'} mit gelöscht.${affected ? ` ${affected === 1 ? '1 Eintrag verliert' : affected + ' Einträge verlieren'} dadurch den Tisch.` : ''}`
          : 'Auf diesem Plan ist noch nichts eingezeichnet.';
        if (!(await askConfirm(`„${floorName(f)}“ löschen?`, text, 'Geschoss löschen'))) break;
        commit((s) => {
          s.floors = s.floors.filter((x) => x.id !== f.id);
          s.tables = s.tables.filter((t) => t.floorId !== f.id);
          s.objects = s.objects.filter((o) => o.floorId !== f.id);
          s.guests.forEach((g) => { if (ids.has(g.tableId)) g.tableId = ''; });
        }, { render: false });
        ui.floor = null; ui.sel = null;
        render();
        toast(`„${floorName(f)}“ gelöscht.`, { action: { label: 'Rückgängig', run: undo } });
        break;
      }
      case 'plan-del': deleteSelected(); break;
      case 'plan-dup': {
        const found = findItem(ui.sel);
        if (!found) break;
        let copy;
        commit((s) => {
          copy = Object.assign({}, found.item, { id: uid() });
          if (found.kind === 'table') copy.label = nextTableLabel(s);
          const p = findFreeSpot(s, copy.w, copy.h, null, copy.floorId);
          copy.x = p.x; copy.y = p.y;
          (found.kind === 'table' ? s.tables : s.objects).push(copy);
        }, { render: false });
        ui.sel = copy.id; render();
        break;
      }
      case 'plan-rot': {
        const found = findItem(ui.sel);
        if (!found) break;
        commit(() => { const it = found.item; [it.w, it.h] = [it.h, it.w]; keepInRoom(it); }, { render: false });
        refreshPlan();
        break;
      }
      case 'plan-shape': {
        const found = findItem(ui.sel);
        if (!found || found.kind !== 'table' || found.item.shape === b.dataset.shape) break;
        commit(() => {
          const t = found.item;
          t.shape = b.dataset.shape;
          if (t.shape === 'rect') { t.w = 24; t.h = 9; } else { t.w = 18; t.h = 18; }
          keepInRoom(t);
        }, { render: false });
        refreshPlan();
        break;
      }

      // --- Programm ---
      case 'prog-add':
        commit((s) => { s.program.push({ id: uid(), time: '', title: '', desc: '' }); }, { render: false });
        render();
        { const rows = document.querySelectorAll('.prog-row [data-p="title"]'); const last = rows[rows.length - 1]; if (last) last.focus(); }
        break;
      case 'prog-chip':
        commit((s) => { s.program.push({ id: uid(), time: b.dataset.time, title: b.dataset.title, desc: '' }); });
        break;
      case 'prog-del': commit((s) => { s.program = s.program.filter((p) => p.id !== id); }); toast('Programmpunkt gelöscht.', { action: { label: 'Rückgängig', run: undo } }); break;

      // --- Karte ---
      case 'menu-add-cat':
        commit((s) => { s.menu.push({ id: uid(), title: '', items: [{ id: uid(), name: '', desc: '', price: '' }] }); }, { render: false });
        render();
        { const heads = document.querySelectorAll('[data-mc="title"]'); const last = heads[heads.length - 1]; if (last) last.focus(); }
        break;
      case 'menu-chip':
        commit((s) => { s.menu.push({ id: uid(), title: b.dataset.title, items: [{ id: uid(), name: '', desc: '', price: '' }] }); });
        break;
      case 'menu-del-cat': commit((s) => { s.menu = s.menu.filter((c) => c.id !== id); }); toast('Kategorie gelöscht.', { action: { label: 'Rückgängig', run: undo } }); break;
      case 'menu-add-item': {
        const cid = b.dataset.cat;
        let newId;
        commit((s) => { const c = s.menu.find((x) => x.id === cid); if (c) { newId = uid(); c.items.push({ id: newId, name: '', desc: '', price: '' }); } }, { render: false });
        render();
        if (newId) { const el = document.querySelector(`[data-mi="name"][data-id="${newId}"]`); if (el) el.focus(); }
        break;
      }
      case 'menu-del-item': commit((s) => { const c = s.menu.find((x) => x.id === b.dataset.cat); if (c) c.items = c.items.filter((i) => i.id !== id); }); break;
      case 'menu-move':
        commit((s) => {
          const c = s.menu.find((x) => x.id === b.dataset.cat);
          if (!c) return;
          const i = c.items.findIndex((x) => x.id === id), j = i + Number(b.dataset.dir);
          if (i < 0 || j < 0 || j >= c.items.length) return;
          [c.items[i], c.items[j]] = [c.items[j], c.items[i]];
        });
        break;

      // --- QR-Code ---
      case 'qr-poster': {
        const c = await posterCanvas();
        if (c && await download(slug(state.event.name) + '-aushang-qr-code.png', await canvasBlob(c))) toast('Aushang heruntergeladen.');
        break;
      }
      case 'qr-png': {
        const m = qrMatrix(state.event.guestUrl.trim());
        if (!m) break;
        const c = document.createElement('canvas');
        c.width = c.height = 1200;
        drawQR(c.getContext('2d'), m, 0, 0, 1200);
        if (await download(slug(state.event.name) + '-qr-code.png', await canvasBlob(c))) toast('QR-Code heruntergeladen.');
        break;
      }
      case 'qr-print': printPoster(); break;
      case 'use-this-url':
        commit((s) => { s.event.guestUrl = location.origin + location.pathname; });
        break;
      case 'gh-test': {
        const st = document.getElementById('gh-status');
        if (!ghReady(ghConfig())) { if (st) st.textContent = 'Bitte Benutzer, Repository und Token ausfüllen.'; break; }
        if (st) st.textContent = 'Teste die Verbindung …';
        const ok = await ghLoadRemote();
        if (ok) { render(); toast('Verbindung zu GitHub klappt.'); } else if (st) st.textContent = gh.status;
        break;
      }
      case 'gh-forget': {
        const c = store.get(GH_KEY) || {};
        delete c.token; store.set(GH_KEY, c); gh.status = ''; gh.sha = null;
        render(); toast('Token von diesem Gerät gelöscht.');
        break;
      }
      case 'qr-copy': {
        const url = state.event.guestUrl.trim();
        try { await navigator.clipboard.writeText(url); toast('Link kopiert.'); } catch (err) {
          const input = document.getElementById('guest-url');
          if (input) { input.focus(); input.select(); }
          toast('Kopieren ging nicht automatisch. Der Link ist markiert, kopiere ihn mit Strg+C.');
        }
        break;
      }

      // --- Einstellungen ---
      case 'export-html': {
        const copy = JSON.parse(JSON.stringify(state));
        copy.updatedAt = new Date().toISOString();
        if (await download(slug(state.event.name) + '-gaesteseite.html', buildDocument(copy))) toast('HTML-Datei heruntergeladen.');
        break;
      }
      case 'clear-guests':
        if (!(await askConfirm('Alle Gäste löschen?', `Alle ${state.guests.length} Einträge werden entfernt. Tische und Saalplan bleiben erhalten.`, 'Alle löschen'))) break;
        commit((s) => { s.guests = []; });
        toast('Alle Gäste gelöscht.', { action: { label: 'Rückgängig', run: undo } });
        break;
      case 'reset-all':
        if (!(await askConfirm('Wirklich alles löschen?', 'Gäste, Tische, Saalplan, Programm und Karte werden entfernt. Name und Link bleiben.', 'Alles löschen'))) break;
        commit((s) => {
          const keep = { name: s.event.name, guestUrl: s.event.guestUrl };
          Object.assign(s, emptyState(), { updatedAt: s.updatedAt });
          s.event.name = keep.name; s.event.guestUrl = keep.guestUrl;
        });
        ui.sel = null;
        toast('Alles gelöscht.', { action: { label: 'Rückgängig', run: undo } });
        break;
      default: break;
    }
  }

  function onInput(e) {
    const el = e.target, d = el.dataset;
    if (el.id === 'g-q') {
      ui.query = el.value;
      const r = document.getElementById('g-results');
      if (r) r.innerHTML = resultsHTML();
      return;
    }
    if (el.id === 'g-filter') { ui.gFilter = el.value; document.getElementById('g-table').innerHTML = guestListHTML(); return; }
    if (el.id === 'import-text') { ui.importText = el.value; document.getElementById('import-preview').innerHTML = importPreviewHTML(); return; }
    if (d.gh) {
      // GitHub-Zugang: nur lokal im Browser, nicht Teil der Ballseite
      const c = store.get(GH_KEY) || {};
      c[d.gh] = el.value.trim();
      store.set(GH_KEY, c); gh.sha = null; gh.status = '';
      return;
    }
    if (d.bind) {
      if (el.type === 'time' || el.type === 'date') return; // erst bei "change"
      commit((s) => setPath(s, d.bind, el.value), { key: 'bind:' + d.bind, render: false });
      if (d.bind === 'event.name') { const n = document.getElementById('a-brand-name'); if (n) n.textContent = el.value || 'Unser Ball'; }
      if (d.bind === 'event.guestUrl') { const q = document.getElementById('qr-area'); if (q) q.innerHTML = qrAreaHTML(); }
      return;
    }
    if (d.floor === 'name') {
      const f = curFloor();
      commit(() => { f.name = el.value.slice(0, 40); }, { key: 'floor:' + f.id + ':name', render: false });
      const bar = document.getElementById('floor-bar'); if (bar) bar.innerHTML = floorBarHTML();
      return;
    }
    if (d.g === 'name' || d.g === 'count') {
      const id = el.closest('[data-id]').dataset.id;
      const g = state.guests.find((x) => x.id === id);
      if (!g) return;
      if (d.g === 'name') commit(() => { g.name = el.value.slice(0, 120); }, { key: 'g:' + id + ':name', render: false });
      else { const n = parseInt(el.value, 10); if (n >= 1 && n <= 50) commit(() => { g.count = n; }, { key: 'g:' + id + ':count', render: false }); }
      return;
    }
    if (d.t) {
      const found = findItem(ui.sel);
      if (!found || found.kind !== 'table') return;
      const t = found.item;
      if (d.t === 'label') {
        commit(() => { t.label = el.value.slice(0, 30); }, { key: 't:' + t.id + ':label', render: false });
        const h = document.getElementById('props-title'); if (h) h.textContent = tableName(t);
      } else if (d.t === 'seats') {
        const n = parseInt(el.value, 10);
        if (n >= 1 && n <= 60) commit(() => { t.seats = n; }, { key: 't:' + t.id + ':seats', render: false });
      } else {
        const v = fromM(el.value);
        if (!(v >= 4 && v <= 400)) return;
        commit(() => { if (d.t === 'd') { t.w = v; t.h = v; } else t[d.t] = v; keepInRoom(t); }, { key: 't:' + t.id + ':' + d.t, render: false });
      }
      refreshPlan(false);
      return;
    }
    if (d.o === 'label' || d.o === 'w' || d.o === 'h') {
      const found = findItem(ui.sel);
      if (!found || found.kind !== 'obj') return;
      const o = found.item;
      if (d.o === 'label') {
        commit(() => { o.label = el.value.slice(0, 40); }, { key: 'o:' + o.id + ':label', render: false });
        const h = document.getElementById('props-title'); if (h) h.textContent = o.label || OBJ[o.type].name;
      } else {
        const v = fromM(el.value);
        if (!(v >= 2 && v <= 2000)) return;
        commit(() => { o[d.o] = Math.min(v, d.o === 'w' ? floorOf(o).w : floorOf(o).h); keepInRoom(o); }, { key: 'o:' + o.id + ':' + d.o, render: false });
      }
      refreshPlan(false);
      return;
    }
    if (d.p === 'title' || d.p === 'desc') {
      const id = el.closest('[data-id]').dataset.id;
      const p = state.program.find((x) => x.id === id);
      if (p) commit(() => { p[d.p] = el.value.slice(0, d.p === 'title' ? 120 : 300); }, { key: 'p:' + id + ':' + d.p, render: false });
      return;
    }
    if (d.mc === 'title') {
      const c = state.menu.find((x) => x.id === d.id);
      if (c) commit(() => { c.title = el.value.slice(0, 80); }, { key: 'mc:' + c.id, render: false });
      return;
    }
    if (d.mi) {
      const c = state.menu.find((x) => x.id === d.cat);
      const i = c && c.items.find((x) => x.id === d.id);
      if (i) commit(() => { i[d.mi] = el.value.slice(0, d.mi === 'price' ? 30 : d.mi === 'desc' ? 200 : 120); }, { key: 'mi:' + i.id + ':' + d.mi, render: false });
    }
  }

  function onChange(e) {
    const el = e.target, d = el.dataset;
    if (d.bind && (el.type === 'time' || el.type === 'date')) {
      commit((s) => setPath(s, d.bind, el.value), { render: false });
      return;
    }
    if (d.g === 'table') {
      const id = el.closest('[data-id]').dataset.id;
      const g = state.guests.find((x) => x.id === id);
      if (!g) return;
      commit(() => { g.tableId = el.value; }, { render: false });
      if (ui.gUnassigned && g.tableId) document.getElementById('g-table').innerHTML = guestListHTML();
      else el.closest('.gl-row').classList.toggle('unassigned', !g.tableId);
      return;
    }
    if (el.id === 'g-unassigned') { ui.gUnassigned = el.checked; document.getElementById('g-table').innerHTML = guestListHTML(); return; }
    if (el.id === 'g-sort') { ui.gSort = el.value; document.getElementById('g-table').innerHTML = guestListHTML(); return; }
    if (el.id === 'snap') { ui.snap = el.checked; return; }
    if (el.id === 'import-file' && el.files && el.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        ui.importText = String(reader.result || '');
        const ta = document.getElementById('import-text'); if (ta) ta.value = ui.importText;
        document.getElementById('import-preview').innerHTML = importPreviewHTML();
      };
      reader.readAsText(el.files[0]);
      return;
    }
    if (d.room) {
      const f = curFloor(), v = fromM(el.value);
      if (!(v >= 60 && v <= 2000)) { el.value = toM(f[d.room]); toast('Bitte eine Größe zwischen 6 und 200 Metern eingeben.'); return; }
      commit((s) => { f[d.room] = v; s.tables.concat(s.objects).filter((it) => it.floorId === f.id).forEach(keepInRoom); }, { render: false });
      refreshPlan(false);
      return;
    }
    if (d.move === 'floor') {
      const found = findItem(ui.sel);
      if (!found || !state.floors.some((f) => f.id === el.value)) return;
      const it = found.item;
      commit((s) => {
        it.floorId = el.value;
        keepInRoom(it);
        if (overlapsOthers(it)) { const p = findFreeSpot(s, it.w, it.h, it.id, it.floorId); it.x = p.x; it.y = p.y; }
      }, { render: false });
      ui.floor = it.floorId;
      render();
      toast(`${found.kind === 'table' ? tableName(it) : objName(it)} ist jetzt im Plan „${floorName(floorOf(it))}“.`);
      return;
    }
    if (d.o === 'type') {
      const found = findItem(ui.sel);
      if (!found || found.kind !== 'obj') return;
      commit(() => { found.item.type = OBJ[el.value] ? el.value : 'other'; }, { render: false });
      refreshPlan();
      return;
    }
    if (d.p === 'time') {
      const id = el.closest('[data-id]').dataset.id;
      const p = state.program.find((x) => x.id === id);
      if (p) commit(() => { p.time = el.value; });
      return;
    }
    if (d.opt) { commit((s) => { s.options[d.opt] = el.checked; }, { render: false }); }
  }

  function onKeyDown(e) {
    const t = e.target;
    if (e.key === 'Enter' && (t.id === 'add-name' || t.id === 'add-count' || t.id === 'add-table')) { e.preventDefault(); addGuestFromForm(); return; }
    if (e.key === 'Enter' && t.id === 'g-q') {
      e.preventDefault();
      const list = searchGuests(ui.query);
      if (list.length === 1) document.querySelector('.result').click();
      t.blur();
    }
  }
  function onDocKeyDown(e) {
    if (ui.mode !== 'admin' || document.querySelector('.modal-ov')) return;
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
    if (mod && !e.shiftKey && e.key.toLowerCase() === 'z' && !inField) { e.preventDefault(); undo(); return; }
    if (ui.aTab !== 'plan' || !ui.sel || inField) return;
    const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (dir) {
      e.preventDefault();
      const found = findItem(ui.sel);
      if (!found) return;
      const step = e.shiftKey ? 1 : 5;
      commit(() => { found.item.x += dir[0] * step; found.item.y += dir[1] * step; keepInRoom(found.item); }, { key: 'nudge:' + ui.sel, render: false });
      refreshPlan(false);
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault(); deleteSelected();
    } else if (e.key === 'Escape') {
      ui.sel = null; refreshPlan();
    }
  }

  // ===================================================================
  // 11. Start
  // ===================================================================
  async function detectCapabilities(sess) {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    const use = (n) => Promise.resolve().then(() => c.use(n)).catch(() => null);
    const [art, usr, dl] = await Promise.all([use('artifact'), use('user'), use('downloads')]);
    caps.artifact = art; caps.downloads = dl;
    let canEdit = null;
    if (usr) { try { canEdit = await usr.canEdit(); } catch (e) { canEdit = null; } }
    // Nur bei bestätigtem Bearbeitungsrecht den Verwaltungs-Link zeigen (Gäste sollen ihn nie sehen)
    ui.canAdmin = canEdit === true;
    ui.adminMaybe = canEdit === null && !!art; // Notausgang: 5× auf den Ballnamen tippen
    // Wer bearbeiten darf, landet direkt in der Verwaltung
    if (ui.canAdmin && ui.mode === 'guest' && !ui.preview && (canEdit === true || (sess && sess.mode === 'admin'))) {
      ui.mode = 'admin';
      if (sess && sess.aTab) ui.aTab = sess.aTab;
    }
    render();
    if (sess && sess.justSaved && ui.mode === 'admin') toast('Gespeichert. Gäste sehen jetzt die neue Version.');
  }

  function init() {
    const sess = store.get(UI_KEY, 'session');
    store.del(UI_KEY, 'session');
    const me = store.get(ME_KEY);
    if (me && state.guests.some((g) => g.id === me)) ui.meId = me;
    const draft = store.get(DRAFT_KEY);
    if (draft && draft.state) {
      if (draft.pending && draft.pending === state.updatedAt) store.del(DRAFT_KEY);
      else if (JSON.stringify(normalizeState(draft.state)) === published) store.del(DRAFT_KEY);
      else ui.draft = draft;
    }
    root.addEventListener('click', onClick);
    root.addEventListener('input', onInput);
    root.addEventListener('change', onChange);
    root.addEventListener('keydown', onKeyDown);
    root.addEventListener('pointerdown', onPointerDown);
    root.addEventListener('pointermove', onPointerMove);
    root.addEventListener('pointerup', onPointerUp);
    root.addEventListener('pointercancel', onPointerUp);
    document.addEventListener('keydown', onDocKeyDown);
    window.addEventListener('beforeunload', (e) => {
      if (ui.mode === 'admin' && !ui.saving && isDirty()) { e.preventDefault(); e.returnValue = ''; }
    });
    // Jede halbe Minute „Als Nächstes“ aktualisieren
    setInterval(() => {
      if (ui.mode !== 'guest') return;
      const n = document.getElementById('g-next');
      if (n) n.innerHTML = nextBanner();
      if (ui.gTab === 'program') { const b = document.getElementById('g-body'); if (b) b.innerHTML = programView(); }
    }, 30000);
    ui.hosted = !window.claude || typeof window.claude.use !== 'function';
    render();
    if (ui.hosted) {
      const check = () => { if (/^#verwaltung$/i.test(location.hash) && ui.mode !== 'admin') enterHostedAdmin(); };
      window.addEventListener('hashchange', check);
      check();
    } else {
      detectCapabilities(sess);
    }
  }

  // Für automatische Tests von außen erreichbar (ändert nichts am Verhalten)
  window.__ballplan = { get state() { return state; }, ui, buildDocument, parseImport, searchGuests, canon, normalizeState, isDirty: () => isDirty() };

  init();
})();
</script>
