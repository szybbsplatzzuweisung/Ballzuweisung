<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ball des SZ Ybbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Jost:wght@400;500;600&display=swap">
<style id="app-style">/* ===== Farben & Schriften (hell) ===== */
:root {
  --bg: #EDEFF4; --surface: #FFFFFF; --surface-2: #F5F6F9;
  --text: #18213D; --muted: #596079; --line: #D3D8E3; --line-strong: #AEB5C7;
  --accent: #9C7A43; --accent-soft: #F1E8D6;
  --hl: #8C1D40; --hl-text: #FFFFFF;
  --ok: #2E6A4E; --warn: #9A5600; --danger: #A3262A;
  --plan-bg: #FCFCFD; --plan-stroke: #18213D; --plan-grid: #E4E7EF;
  --table: #FFFFFF; --table-dim: #EEF0F5; --chair: #C3CAD9;
  --floor-a: #F0E5CE; --floor-b: #E6D5B4; --zone: #F0F2F6;
  --serif: "Bodoni Moda", "Bodoni 72", "Didot", "Bodoni MT", Georgia, serif;
  --sans: "Jost", "Futura", "Avenir Next", "Century Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* ===== Farben (dunkel) ===== */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1428; --surface: #161E36; --surface-2: #1C2541;
    --text: #EEE9DD; --muted: #A3AAC2; --line: #2A3453; --line-strong: #46517A;
    --accent: #D2B47A; --accent-soft: #2B2820;
    --hl: #C2456E; --hl-text: #FFFFFF;
    --ok: #74C49E; --warn: #E6AC5C; --danger: #F07075;
    --plan-bg: #121A31; --plan-stroke: #D9D3C3; --plan-grid: #1D2643;
    --table: #1E2846; --table-dim: #18203A; --chair: #3C4769;
    --floor-a: #3A3324; --floor-b: #2F2A1E; --zone: #1A2340;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1428; --surface: #161E36; --surface-2: #1C2541;
  --text: #EEE9DD; --muted: #A3AAC2; --line: #2A3453; --line-strong: #46517A;
  --accent: #D2B47A; --accent-soft: #2B2820;
  --hl: #C2456E; --hl-text: #FFFFFF;
  --ok: #74C49E; --warn: #E6AC5C; --danger: #F07075;
  --plan-bg: #121A31; --plan-stroke: #D9D3C3; --plan-grid: #1D2643;
  --table: #1E2846; --table-dim: #18203A; --chair: #3C4769;
  --floor-a: #3A3324; --floor-b: #2F2A1E; --zone: #1A2340;
  color-scheme: dark;
}

/* ===== Grundlagen ===== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
small { font-size: .85em; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 40px; padding: .4em 1.05em;
  border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  cursor: pointer; font-weight: 500; font-size: .95rem; white-space: nowrap; }
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.hl { background: var(--hl); color: var(--hl-text); border-color: var(--hl); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger-fill { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.small { min-height: 32px; padding: .2em .8em; font-size: .875rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; padding: 0; flex: none; border-radius: 50%;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); cursor: pointer; font-size: 1.1rem; line-height: 1; }
.icon-btn:hover { border-color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.icon-btn.plain { border-color: transparent; background: transparent; }

input[type=text], input[type=url], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
  width: 100%; min-height: 40px; padding: .4em .7em; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); color: var(--text); }
textarea { resize: vertical; min-height: 90px; line-height: 1.45; }
.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.field > span { font-size: .85rem; color: var(--muted); font-weight: 500; }
.check { display: inline-flex; align-items: center; gap: .5em; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--hl); margin: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ===== Gästeansicht ===== */
.g-wrap { max-width: 560px; margin: 0 auto; padding: 34px 20px 48px; }
.g-wrap.has-tabs { padding-bottom: 116px; }
.g-head { text-align: center; margin-bottom: 26px; }
.g-head.compact { margin-bottom: 18px; }
.g-head.compact .g-title { font-size: clamp(1.5rem, 6vw, 2rem); }
.g-title { font-family: var(--serif); font-weight: 600; font-size: clamp(2.1rem, 9vw, 3.1rem); line-height: 1.04;
  letter-spacing: -.015em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.g-sub { margin: .55rem 0 0; color: var(--muted); }
.g-sub + .g-sub { margin-top: .05rem; }
.orn { display: block; width: 150px; height: 14px; margin: 18px auto 0; fill: none; stroke: var(--accent); stroke-width: 1; }
.orn .dot { fill: var(--accent); stroke: none; }
.g-intro { text-align: center; margin: 0 0 18px; font-size: 1.05rem; text-wrap: pretty; }
.search { position: relative; display: block; }
.search svg { position: absolute; left: 19px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;
  fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.search input { height: 58px; padding: 0 20px 0 50px; font-size: 1.15rem; border-radius: 999px; border: 1.5px solid var(--text); }
.search input::placeholder { color: var(--muted); }
.results { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.result { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 18px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; text-align: left; }
.result:hover { border-color: var(--text); }
.r-name { font-weight: 500; font-size: 1.05rem; display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.r-name small { color: var(--muted); font-weight: 400; }
.r-table { font-family: var(--serif); font-weight: 600; font-size: 1.15rem; white-space: nowrap; color: var(--hl); }
.r-table.none { font-family: var(--sans); font-weight: 400; font-size: .9rem; color: var(--muted); }
.g-none, .g-empty { text-align: center; color: var(--muted); margin: 18px 0 0; text-wrap: pretty; }

.next-banner { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 12px; width: 100%; margin: 0 0 24px; padding: 12px 16px;
  border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--text); text-align: left; cursor: pointer; }
.nb-label { font-size: .88rem; color: var(--muted); }
.nb-time { font-family: var(--serif); font-weight: 600; font-size: 1.15rem; }
.nb-title { font-weight: 500; }

.placecard { max-width: 420px; margin: 0 auto; padding: 9px; background: var(--surface); border-radius: 4px;
  box-shadow: 0 1px 0 var(--line), 0 24px 46px -24px rgba(16, 22, 48, .5); }
.pc-in { border: 1px solid var(--accent); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--accent);
  padding: 30px 22px 28px; text-align: center; }
.pc-hello { margin: 0; color: var(--muted); }
.pc-name { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: clamp(1.6rem, 7vw, 2.1rem);
  line-height: 1.15; margin: .15rem 0 0; text-wrap: balance; overflow-wrap: anywhere; }
.pc-count { margin: .3rem 0 0; color: var(--muted); }
.pc-orn { display: block; width: 110px; height: 12px; margin: 18px auto 14px; fill: none; stroke: var(--accent); stroke-width: 1; }
.pc-orn .dot { fill: var(--accent); stroke: none; }
.pc-label { margin: 0; color: var(--muted); }
.pc-num { margin: .05rem 0 0; font-family: var(--serif); font-weight: 600; font-size: clamp(5rem, 26vw, 7.5rem);
  line-height: .95; color: var(--hl); font-variant-numeric: lining-nums; overflow-wrap: anywhere; }
.pc-num.word { font-size: clamp(2.2rem, 10vw, 3.2rem); line-height: 1.1; }
.pc-missing { margin: 0; text-wrap: pretty; }
.pc-floor { margin: .45rem 0 0; color: var(--muted); font-size: 1.05rem; }
.r-table small { display: block; font-family: var(--sans); font-weight: 400; font-size: .78rem; color: var(--muted); text-align: right; }
.step-title { font-weight: 600; margin: 18px 0 8px; }
.plan-head + .step-title { margin-top: 4px; }
.g-floors { margin: 0 0 12px; flex-wrap: wrap; }
.placecard.reveal { animation: cardIn .8s cubic-bezier(.2, .75, .25, 1) both; }
@keyframes cardIn { from { opacity: 0; transform: perspective(1000px) rotateX(-75deg) translateY(-12px); } to { opacity: 1; transform: none; } }

.g-section { margin-top: 32px; }
.g-section h3, .g-h2 { font-family: var(--serif); font-weight: 600; font-size: 1.4rem; line-height: 1.2; margin: 0 0 12px; }
.plan-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.plan-head h3, .plan-head .g-h2 { margin: 0; }
.plan-caption { color: var(--muted); font-size: .92rem; margin: .6rem 0 0; }
.zoom { display: flex; gap: 6px; }
.mates { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.mates li { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: .95rem; }
.g-again { text-align: center; margin-top: 32px; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 4.2rem 1fr; gap: 0 26px; padding: 11px 0; position: relative; }
.timeline li::before { content: ""; position: absolute; left: calc(4.2rem + 13px); top: 0; bottom: 0; width: 1px; background: var(--line-strong); }
.timeline li:first-child::before { top: 1.3rem; }
.timeline li:last-child::before { bottom: calc(100% - 1.3rem); }
.timeline li::after { content: ""; position: absolute; left: calc(4.2rem + 8px); top: 1.05rem; width: 11px; height: 11px;
  border-radius: 50%; background: var(--bg); border: 1.5px solid var(--accent); }
.timeline li.next::after { background: var(--hl); border-color: var(--hl); }
.tl-time { font-family: var(--serif); font-weight: 600; font-size: 1.2rem; text-align: right; line-height: 1.35; font-variant-numeric: lining-nums tabular-nums; }
.tl-title { margin: 0; font-weight: 500; font-size: 1.08rem; }
.tl-desc { margin: .1rem 0 0; color: var(--muted); }
.timeline li.past .tl-time, .timeline li.past .tl-title { color: var(--muted); }
.tag { display: inline-block; margin-left: 8px; padding: 0 9px; border-radius: 999px; background: var(--hl); color: var(--hl-text);
  font-size: .78rem; font-weight: 500; vertical-align: 2px; }
.tag.now { background: var(--accent); color: #fff; }

.menu-cat { margin-bottom: 28px; }
.menu-cat h3 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 1.4rem; margin: 0 0 6px; }
.menu-list { list-style: none; margin: 0; padding: 0; }
.menu-list li { padding: 8px 0; }
.mi-row { display: flex; align-items: baseline; gap: 8px; }
.mi-name { font-weight: 500; }
.mi-dots { flex: 1; min-width: 16px; border-bottom: 1px dotted var(--line-strong); transform: translateY(-4px); }
.mi-price { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mi-desc { margin: .1rem 0 0; color: var(--muted); font-size: .92rem; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px;
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.tabbar button { flex: 1; max-width: 130px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px;
  border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: .8rem; font-weight: 500; cursor: pointer; }
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current=page] { color: var(--hl); }
.g-foot { text-align: center; margin-top: 44px; }
.linkish { background: none; border: 0; padding: 8px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .9rem; }
.preview-pill { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; display: flex; align-items: center; justify-content: center;
  gap: 12px; flex-wrap: wrap; padding: 8px 12px; background: var(--text); color: var(--bg); font-size: .92rem; }

/* ===== Saalplan (SVG) ===== */
.plan-box { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--plan-bg); overflow: auto; -webkit-overflow-scrolling: touch; }
.plan-box svg { display: block; width: 100%; height: auto; max-width: none; user-select: none; -webkit-user-select: none; }
.plan-box text { pointer-events: none; }
.plan-box .room { fill: var(--plan-bg); }
.plan-box .room-line { fill: none; stroke: var(--plan-stroke); stroke-width: 1.4; }
.plan-box .gridl { fill: none; stroke: var(--plan-grid); stroke-width: .35; }
.plan-box .fl-a { fill: var(--floor-a); }
.plan-box .fl-b { fill: var(--floor-b); }
.plan-box .hatch { stroke: var(--line-strong); stroke-width: .6; }
.plan-box .zone { fill: var(--zone); stroke: var(--line-strong); stroke-width: .5; }
.plan-box .zone-dance { stroke: var(--accent); stroke-width: .7; }
.plan-box .zone-entrance { fill: var(--accent-soft); stroke: var(--accent); stroke-width: .8; }
.plan-box .zone-label { fill: var(--muted); font-family: var(--sans); font-weight: 500; paint-order: stroke; stroke: var(--plan-bg);
  stroke-width: 1px; stroke-linejoin: round; }
.plan-box .zone-entrance + .zone-label, .plan-box .zone-label.strong { fill: var(--text); }
.plan-box .zone-stairs, .plan-box .zone-lift { fill: var(--surface-2); stroke: var(--plan-stroke); stroke-width: .5; }
.plan-box .step-line { stroke: var(--line-strong); stroke-width: .45; }
.plan-box .hlz .zone { fill: var(--hl); stroke: var(--hl); }
.plan-box .hlz .step-line { stroke: var(--hl-text); opacity: .45; }
.plan-box .hlz .zone-label { fill: var(--hl-text); stroke: var(--hl); }
.plan-box .chair { fill: var(--chair); }
.plan-box .t-top { fill: var(--table); stroke: var(--plan-stroke); stroke-width: .55; }
.plan-box .t-num { fill: var(--text); font-family: var(--serif); font-weight: 600; }
.plan-box .dim .t-top { fill: var(--table-dim); stroke: var(--line-strong); }
.plan-box .dim .t-num { fill: var(--muted); }
.plan-box .dim .chair { opacity: .55; }
.plan-box .hl .t-top { fill: var(--hl); stroke: var(--hl); }
.plan-box .hl .t-num { fill: var(--hl-text); }
.plan-box .hl .chair { fill: var(--hl); opacity: .5; }
.plan-box .pulse { fill: none; stroke: var(--hl); stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.95); opacity: .9; } 100% { transform: scale(1.55); opacity: 0; } }
.plan-box .route { fill: none; stroke: var(--hl); stroke-width: 1.1; stroke-dasharray: 2.6 2.2; stroke-linecap: round; }
.plan-box .arrowhead, .plan-box .route-start { fill: var(--hl); }
.plan-box .occ { font-family: var(--sans); font-weight: 600; }
.plan-box .occ.ok { fill: var(--ok); }
.plan-box .occ.full { fill: var(--text); }
.plan-box .occ.over { fill: var(--danger); }
.plan-box .occ.empty { fill: var(--muted); }
.plan-box .sel-box { fill: none; stroke: var(--accent); stroke-width: .7; stroke-dasharray: 2 1.4; }
.plan-box .sel .t-top { stroke: var(--accent); stroke-width: 1.1; }
.editor { touch-action: pan-x pan-y; }
.editor svg .it { cursor: grab; touch-action: none; }
.editor svg .it:active { cursor: grabbing; }
.editor svg .it:hover .t-top, .editor svg .it:hover .zone { stroke: var(--accent); }

/* ===== Verwaltung ===== */
.a-shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.a-side, .a-main { min-width: 0; }
.a-side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; display: flex; flex-direction: column; gap: 20px; padding: 28px 16px; }
.a-brand-name { font-family: var(--serif); font-weight: 600; font-size: 1.35rem; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.a-brand-sub { margin: .2rem 0 0; color: var(--muted); font-size: .9rem; }
.a-nav { display: flex; flex-direction: column; gap: 2px; }
.a-nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border: 0; border-radius: 10px;
  background: none; color: var(--text); font-weight: 500; text-align: left; cursor: pointer; }
.a-nav button:hover { background: var(--surface-2); }
.a-nav button[aria-current=page] { background: var(--surface); box-shadow: inset 3px 0 0 var(--hl); }
.cnt { color: var(--muted); font-size: .85rem; font-weight: 400; font-variant-numeric: tabular-nums; }
.a-main { padding: 32px 36px 150px; min-width: 0; max-width: 1180px; }
.a-h { font-family: var(--serif); font-weight: 600; font-size: 2.15rem; line-height: 1.1; margin: 0 0 6px; }
.a-lead { color: var(--muted); margin: 0 0 22px; max-width: 68ch; }
.a-sec { margin-top: 32px; }
.a-sec > h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 12px; }
.hint { color: var(--muted); font-size: .88rem; margin: .5rem 0 0; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding: 14px 16px;
  border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); margin-bottom: 22px; }
.banner > div:first-child { flex: 1 1 320px; }
.banner.warn { border-color: var(--warn); background: var(--surface); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; margin: 22px 0 0; padding: 0;
  background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stats > div { background: var(--surface); padding: 14px 16px; }
.stats dt { color: var(--muted); font-size: .88rem; }
.stats dd { margin: .15rem 0 0; font-family: var(--serif); font-size: 1.9rem; font-weight: 600; line-height: 1.1; font-variant-numeric: lining-nums; }
.stats dd small { font-family: var(--sans); font-size: .85rem; font-weight: 400; color: var(--muted); }
.stats dd.warn { color: var(--warn); }
.issues { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.issues li { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ok-line { color: var(--ok); margin: 0; }

.addrow { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.addrow .grow { flex: 1 1 220px; }
.addrow .w-sm { flex: 0 0 92px; }
.addrow .w-md { flex: 0 0 130px; }
.toolbar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin: 26px 0 8px; }
.toolbar input[type=search] { flex: 1 1 200px; width: auto; }
.toolbar select { width: auto; }
.spacer { flex: 1; }
.gl-head, .gl-row { display: grid; grid-template-columns: minmax(0, 1fr) 86px 180px 40px; gap: 8px; align-items: center; }
.gl-head { color: var(--muted); font-size: .85rem; padding: 8px 0; border-bottom: 1px solid var(--line); }
.gl-row { padding: 4px 0; border-bottom: 1px solid var(--line); }
.gl input.cell, .gl select.cell, .prog-row input, .me-row input { border-color: transparent; background: transparent; }
.gl input.cell:hover, .gl select.cell:hover, .prog-row input:hover, .me-row input:hover { border-color: var(--line); }
.gl input.cell:focus, .gl select.cell:focus, .prog-row input:focus, .me-row input:focus { border-color: var(--text); background: var(--surface); }
.gl-row.unassigned select { color: var(--warn); }
.gl-empty { color: var(--muted); padding: 18px 0; margin: 0; }
.import { margin: 8px 0 18px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: grid; gap: 12px; }
.import p { margin: 0; }
.import-sum { font-weight: 500; }
.import-prev { width: 100%; border-collapse: collapse; font-size: .92rem; }
.import-prev th, .import-prev td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
.import-prev th { color: var(--muted); font-weight: 500; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.plan-tools { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; margin-bottom: 14px; }
.tool-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tool-group select { width: auto; min-height: 32px; padding: .15em .5em; }
.room-size input { width: 66px; min-height: 32px; padding: .15em .4em; text-align: center; }
.plan-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.plan-props { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.plan-props h2 { font-family: var(--serif); font-weight: 600; font-size: 1.45rem; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.plan-props h3 { font-size: .95rem; font-weight: 600; margin: 6px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.plan-props p { margin: 0; }
.seg { display: inline-flex; align-self: flex-start; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; cursor: pointer; color: var(--text); }
.seg button.on { background: var(--text); color: var(--bg); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.occ-chip { font-size: .8rem; font-weight: 500; padding: 1px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.occ-chip.over { background: var(--danger); color: #fff; }
.mini-list { margin: 0; padding-left: 1.1rem; font-size: .93rem; }
.item-list { display: flex; flex-wrap: wrap; gap: 6px; }
.item-list button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 9px; cursor: pointer; color: var(--text); font-size: .88rem; }
.item-list button.over { border-color: var(--danger); color: var(--danger); }
.item-list button:hover { border-color: var(--text); }
.plan-box.small { max-width: 760px; }
.floor-h { font-size: .95rem; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
.floor-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.floor-tab { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-weight: 500; min-height: 34px; }
.floor-tab:hover { border-color: var(--text); }
.floor-tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.floor-tab.on .cnt { color: inherit; opacity: .7; }
.floor-tools { align-items: flex-end; }
.floor-name { width: 230px; }
.floor-name input { min-height: 32px; padding: .15em .5em; }
.small-only { display: none; margin: -4px 0 12px; }

.prog-row { display: grid; grid-template-columns: 124px minmax(0, 1fr) minmax(0, 1.4fr) 40px; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.prog-list { border-top: 1px solid var(--line); margin-bottom: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 18px; }
.chip { border: 1px dashed var(--line-strong); background: none; border-radius: 999px; padding: 4px 12px; cursor: pointer; color: var(--text); font-size: .9rem; }
.chip:hover { border-style: solid; border-color: var(--text); }
.menu-edit { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; margin-bottom: 16px; }
.me-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.me-head input { font-family: var(--serif); font-size: 1.25rem; font-weight: 600; border-color: transparent; background: transparent; }
.me-head input:focus, .me-head input:hover { border-color: var(--line-strong); }
.me-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) 104px auto; gap: 8px; align-items: center; padding: 2px 0; }
.me-btns { display: flex; gap: 2px; }
.me-items { margin-bottom: 10px; }

.steps { margin: 0 0 24px; padding-left: 1.3rem; max-width: 66ch; }
.steps li { margin: .35rem 0; }
.qr-wrap { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; margin-top: 24px; }
.poster-prev { margin: 0; width: min(320px, 100%); aspect-ratio: 1 / 1.414; background: #fff; color: #18213D; border-radius: 3px; padding: 26px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
  box-shadow: 0 20px 40px -22px rgba(0, 0, 0, .5); outline: 1px solid #A8844C; outline-offset: -11px; }
.pp-title { font-family: var(--serif); font-weight: 600; font-size: 1.35rem; line-height: 1.1; margin: 0; overflow-wrap: anywhere; }
.pp-qr { width: 74%; }
.pp-qr svg { display: block; width: 100%; height: auto; }
.pp-text { font-family: var(--serif); font-style: italic; margin: 0; font-size: 1.02rem; }
.qr-actions { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 640px; }
.form-grid .span2 { grid-column: 1 / -1; }
.opt-list { display: grid; gap: 10px; }

/* ===== Speicherleiste, Hinweise, Dialoge ===== */
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; pointer-events: none;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.savebar-in { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 7px 7px 7px 18px; border-radius: 999px;
  background: var(--text); color: var(--bg); box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .45); }
.savebar .btn.inv { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 45%, transparent); }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translate(-50%, 16px); opacity: 0;
  pointer-events: none; display: flex; gap: 12px; align-items: center; width: max-content; max-width: min(92vw, 560px); padding: 10px 12px 10px 18px;
  border-radius: 14px; background: var(--text); color: var(--bg); box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .45); transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 45%, transparent); }
.modal-ov { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; background: rgba(10, 14, 30, .5); }
.modal { width: 100%; max-width: 440px; padding: 22px; border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .5); }
.modal h2 { font-family: var(--serif); font-weight: 600; font-size: 1.45rem; margin: 0 0 8px; }
.modal p { margin: 0; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
#print-area { display: none; }

/* ===== Kleinere Bildschirme ===== */
@media (max-width: 1100px) { .plan-layout { grid-template-columns: 1fr; } }
@media (max-width: 899px) {
  .a-shell { grid-template-columns: minmax(0, 1fr); }
  .a-side { z-index: 15; gap: 10px; padding: 14px 16px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
  .a-brand { padding-right: 140px; }
  .a-brand-name { font-size: 1.15rem; }
  .a-brand-sub { display: none; }
  .a-side-foot { position: absolute; right: 14px; top: 12px; }
  .a-nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 12px 8px; }
  .a-nav::-webkit-scrollbar { display: none; }
  .a-nav button { flex: none; white-space: nowrap; padding: 8px 11px; }
  .a-nav button[aria-current=page] { box-shadow: inset 0 -2px 0 var(--hl); }
  .a-main { padding: 22px 16px 150px; }
  .a-h { font-size: 1.75rem; }
}
@media (max-width: 680px) {
  .small-only { display: block; }
  .gl-head { display: none; }
  .gl-row { grid-template-columns: minmax(0, 1fr) 66px 40px; row-gap: 0; padding: 6px 0; }
  .gl-row select.cell { grid-column: 1 / 3; grid-row: 2; }
  .prog-row { grid-template-columns: 112px minmax(0, 1fr) 40px; }
  .prog-row [data-p=desc] { grid-column: 1 / 3; }
  .me-row { grid-template-columns: minmax(0, 1fr) 92px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .me-row [data-mi=desc] { grid-column: 1 / 3; }
  .me-btns { grid-column: 1 / 3; justify-content: flex-end; }
  .form-grid { grid-template-columns: 1fr; }
  .issues li { flex-direction: column; align-items: flex-start; gap: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  .placecard.reveal, .plan-box .pulse { animation: none; }
  .toast { transition: none; }
}
@media print {
  @page { size: A4; margin: 0; }
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block; }
  #print-area img { display: block; width: 100%; height: auto; }
}

<script id="app">/* Tischplan für den Ball: Gäste scannen den QR-Code, suchen ihren Namen und sehen ihren Tisch. */
(function () {
  'use strict';

  // ===================================================================
  // 1. Quelltext merken – daraus wird beim Speichern die neue Seite gebaut
  // ===================================================================
  const SRC = {
    style: document.getElementById('app-style').textContent,
    qr: document.getElementById('qr-lib').textContent,
    app: document.getElementById('app').textContent,
  };
  const FONT_URL = 'https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Jost:wght@400;500;600&display=swap';
  const DRAFT_KEY = 'ballplan-draft-v1';
  const UI_KEY = 'ballplan-ui-v1';
  const ME_KEY = 'ballplan-me-v1';
  const root = document.getElementById('root');

  // ===================================================================
  // 2. Kleine Helfer
  // ===================================================================
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const natCmp = (a, b) => String(a).localeCompare(String(b), 'de', { numeric: true, sensitivity: 'base' });
  const num = (v, fallback) => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : fallback; };
  const toM = (dm) => String(Math.round(dm) / 10).replace('.', ',');          // Dezimeter -> "1,8"
  const fromM = (v) => { const n = num(v, NaN); return Number.isFinite(n) ? Math.round(n * 10) : NaN; }; // "1,8" -> 18
  const str = (v, max) => String(v == null ? '' : v).slice(0, max || 200);

  function storageArea(area) { try { return window[area + 'Storage']; } catch (e) { return null; } }
  const store = {
    get(key, area = 'local') { try { const v = storageArea(area).getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(key, val, area = 'local') { try { storageArea(area).setItem(key, JSON.stringify(val)); } catch (e) { /* nicht verfügbar */ } },
    del(key, area = 'local') { try { storageArea(area).removeItem(key); } catch (e) { /* nicht verfügbar */ } },
  };

  // Namen vergleichbar machen: Groß/klein, Umlaute (ä = ae = a), Akzente
  function canon(s) {
    return String(s || '').toLowerCase()
      .replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ß/g, 'ss')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u');
  }
  const tokens = (s) => canon(s).split(/[^a-z0-9]+/).filter(Boolean);

  function levenshtein(a, b) {
    const row = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      let prev = row[0]; row[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const tmp = row[j];
        row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return row[b.length];
  }

  const ICON = {
    seat: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><circle cx="12" cy="3.6" r="1.5"/><circle cx="12" cy="20.4" r="1.5"/><circle cx="3.6" cy="12" r="1.5"/><circle cx="20.4" cy="12" r="1.5"/></svg>',

  // Bringt geladene Daten in eine sichere, vollständige Form

  let state;

  const tableById = (id) => state.tables.find((t) => t.id === id) || null;

  function occupancy() {
    const m = {};

    return m;
  }
  function findItem(id) {
    const t = state.tables.find((x) => x.id === id);
    if (t) return { kind: 'table', item: t };
    const o = state.objects.find((x) => x.id === id);
    return o ? { kind: 'obj', item: o } : null;
  }
  const floorById = (id) => state.floors.find((f) => f.id === id) || state.floors[0];
  const floorOf = (it) => floorById(it.floorId);

  const floorName = (f) => (f && f.name.trim()) || 'Geschoss';
  const onFloor = (list, f) => list.filter((it) => it.floorId === f.id);
  const tableWhere = (t) => (multiFloor() ? `${tableName(t)} (${floorName(floorOf(t))})` : tableName(t));
  // Aktuell bearbeitetes Geschoss im Saalplan-Editor
  function curFloor() {
    const f = state.floors.find((x) => x.id === ui.floor) || state.floors[0];
    ui.floor = f.id;
    return f;
  }
  const nearest = (list, p) => list.slice().sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))[0] || null;
  function overlapsOthers(it) {
    return state.tables.concat(state.objects).some((o) => o.id !== it.id && o.floorId === it.floorId
      && Math.abs(o.x - it.x) < (o.w + it.w) / 2 + 3 && Math.abs(o.y - it.y) < (o.h + it.h) / 2 + 3);
  }
  function nextTableLabel(s) {

  // Sucht einen freien Platz im Saal (Zeile für Zeile von oben links)
  function findFreeSpot(s, w, h, ignoreId, floorId) {
    const f = s.floors.find((x) => x.id === floorId) || s.floors[0];
    const W = f.w, H = f.h, m = 14; // Platz für Stühle und einen Gang
    const items = s.tables.concat(s.objects).filter((it) => it.id !== ignoreId && it.floorId === f.id);
    for (let y = Math.ceil(h / 2 + m); y <= H - h / 2 - 2; y += 5) {

  // Uhrzeiten eines Balls: alles vor 12:00 gehört schon zum nächsten Tag
  function ballMin(t) {

  }

  // Minuten seit 12:00 am Balltag – oder null, wenn gerade kein Ball ist
  function nowBallMin() {
    const now = new Date();

    if (state.event.date) {
      base = new Date(state.event.date + 'T12:00:00');
      if (isNaN(base)) return null;
    } else {
      base = new Date(now); base.setHours(12, 0, 0, 0);

  function nextItem() {

  }
  function currentItem() {
    const now = nowBallMin();
    if (now == null) return null;

    const last = started[started.length - 1];

  function fmtPrice(p) {

  // Namenssuche: jedes Suchwort muss zu einem Teil des Namens passen (auch mit kleinem Tippfehler)
  function tokenScore(q, t) {

      if (!nt.length) continue;
      let total = 0, ok = true;
      for (const q of qt) {
        let best = 0;
        for (const t of nt) best = Math.max(best, tokenScore(q, t));
        if (!best) { ok = false; break; }
        total += best;
      }
      if (ok) hits.push({ g, score: total });

    hits.sort((a, b) => b.score - a.score || natCmp(a.g.name, b.g.name));

  // ===================================================================

  const ui = {

    aTab: 'overview', sel: null, snap: true, gFilter: '', gUnassigned: false, gSort: 'name', gShowAll: false, addTable: '',
    importOpen: false, importText: '', canAdmin: false, adminMaybe: false, hosted: false, readOnly: false, saving: false, draft: null,

  // ===================================================================
  // 5. Saalplan als SVG

  let svgSeq = 0;
  function labelSize(text, w, h) {

  // o.floor: welches Geschoss · o.hl: markierter Tisch · o.hlObj: markierter Bereich · o.route: {from, to}
  function planSVG(o = {}) {
    const fl = o.floor || state.floors[0];
    const W = fl.w, H = fl.h, pad = 9, id = 'pl' + (++svgSeq);
    const occ = o.occ ? occupancy() : null;
    let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-pad} ${-pad} ${W + pad * 2} ${H + pad * 2}" role="img" aria-label="${esc(o.label || 'Saalplan')}"${o.zoom > 1 ? ` style="width:${o.zoom * 100}%"` : ''}>`;

      <pattern id="${id}h" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v4" class="hatch"/></pattern>
      <pattern id="${id}g" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0v10" class="gridl"/></pattern>

  function objSVG(ob, o, id, fl) {
    const x = -ob.w / 2, y = -ob.h / 2;
    const name = ob.label || OBJ[ob.type].name;
    const fill = ob.type === 'dance' ? ` style="fill:url(#${id}f)"` : '';
    let inner = `<rect class="zone zone-${ob.type}" x="${x}" y="${y}" width="${ob.w}" height="${ob.h}" rx="${ob.type === 'dance' ? 0 : 1}"${fill}/>`;
    if (ob.type === 'stage') inner += `<rect x="${x}" y="${y}" width="${ob.w}" height="${ob.h}" fill="url(#${id}h)"/>`;

      // Beschriftung außen an der Wand, damit die Weglinie sie nicht überdeckt
      const out = fs * 0.85;

    }

  function tableSVG(t, o, occ) {
    const cls = ['it', 'table'];
    const isHl = o.hl && o.hl === t.id;
    if (isHl) cls.push('hl'); else if (o.hl || o.dim) cls.push('dim');
    if (o.sel === t.id) cls.push('sel');

      const side = (count, sign) => {

          g += horiz ? `<circle class="chair" cx="${p}" cy="${off}" r="${cr}"/>` : `<circle class="chair" cx="${off}" cy="${p}" r="${cr}"/>`;

      side(Math.ceil(n / 2), -1); side(Math.floor(n / 2), 1);

    const minSide = Math.min(t.w, t.h), maxSide = Math.max(t.w, t.h);

    let nx = 0, ny = 0, ox = 0, oy = 0, fs, ofs;
    if (used == null) {

    }
    g += `<text class="t-num" x="${nx.toFixed(2)}" y="${ny.toFixed(2)}" font-size="${clamp(fs, 2.4, 12).toFixed(2)}" text-anchor="middle" dominant-baseline="central">${esc(label)}</text>`;
    if (used != null) {
      const st = used > t.seats ? 'over' : used === 0 ? 'empty' : used === t.seats ? 'full' : 'ok';
      g += `<text class="occ ${st}" x="${ox.toFixed(2)}" y="${oy.toFixed(2)}" font-size="${clamp(ofs, 2, 6).toFixed(2)}" text-anchor="middle" dominant-baseline="central">${used}/${t.seats}</text>`;
    }
    if (o.sel === t.id) {
      const ex = (t.shape === 'round' ? t.w / 2 : t.w / 2) + gap + cr + 1, ey = (t.shape === 'round' ? t.w / 2 : t.h / 2) + gap + cr + 1;
      g += `<rect class="sel-box" x="${-ex}" y="${-ey}" width="${ex * 2}" height="${ey * 2}" rx="2"/>`;
    }
    return `<g class="${cls.join(' ')}" data-item="${t.id}" transform="translate(${t.x} ${t.y})">${g}</g>`;
  }
  // Punkt auf dem Rand eines Tisches/Bereichs in Richtung (tx, ty), plus Abstand pad
  function edgePoint(it, tx, ty, pad) {
    const dx = tx - it.x, dy = ty - it.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    let r;
    if (it.shape === 'round') r = it.w / 2;
    else r = Math.min(ux ? (it.w / 2) / Math.abs(ux) : Infinity, uy ? (it.h / 2) / Math.abs(uy) : Infinity);
    return { x: it.x + ux * (r + pad), y: it.y + uy * (r + pad) };
  }
  // Gestrichelter Weg: vom Eingang (Innenkante) oder einer Treppe zum Ziel
  function routeSVG(from, to, fl, id) {
    let sx = from.x, sy = from.y;
    if (from.type === 'entrance') {
      const near = [['t', from.y], ['b', fl.h - from.y], ['l', from.x], ['r', fl.w - from.x]].sort((a, b) => a[1] - b[1])[0][0];
      if (near === 'b') sy = from.y - from.h / 2 - 1.5;
      else if (near === 't') sy = from.y + from.h / 2 + 1.5;
      else if (near === 'l') sx = from.x + from.w / 2 + 1.5;
      else sx = from.x - from.w / 2 - 1.5;
    } else {
      ({ x: sx, y: sy } = edgePoint(from, to.x, to.y, 1.5));
    }
    const e = edgePoint(to, sx, sy, to.seats ? 6.5 : 2.5); // Tische haben Stühle rundherum
    if (Math.hypot(e.x - sx, e.y - sy) < 3) return '';
    return `<g class="route-g"><circle class="route-start" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="1.8"/><path class="route" d="M${sx.toFixed(1)} ${sy.toFixed(1)}L${e.x.toFixed(1)} ${e.y.toFixed(1)}" marker-end="url(#${id}a)"/></g>`;
  }
  // Weg zum Tisch, eventuell über mehrere Geschosse: Liste von Schritten {floor, from, to}
  function wayFor(t) {
    const f = floorOf(t);
    const here = onFloor(state.objects, f);
    const ent = here.find((o) => o.type === 'entrance');
    if (ent) return [{ floor: f, from: ent, to: t }];
    const conn = nearest(here.filter((o) => CONNECT.includes(o.type)), t);
    const steps = [];
    const entObj = state.objects.find((o) => o.type === 'entrance');
    if (conn && entObj) {
      const ef = floorOf(entObj);
      const there = onFloor(state.objects, ef).filter((o) => CONNECT.includes(o.type));
      const conn2 = nearest(there.filter((o) => o.type === conn.type), entObj) || nearest(there, entObj);
      if (conn2) steps.push({ floor: ef, from: entObj, to: conn2 });
    }
    steps.push({ floor: f, from: conn, to: t });
    return steps;
  }
  const objName = (o) => o.label || OBJ[o.type].name;

  // ===================================================================
  function guestTabs() {
    const t = [{ id: 'seat', label: 'Mein Platz', icon: ICON.seat }];

  function guestBody() {
    if (ui.gTab === 'program') return programView();
    if (ui.gTab === 'menu') return menuView();

    return seatView();
  }
  function nextBanner() {
    if (ui.gTab !== 'seat' || !state.options.showProgram) return '';
    const n = nextItem();
    if (!n) return '';
    return `<button class="next-banner" data-act="gtab" data-tab="program"><span class="nb-label">Als Nächstes</span><span class="nb-time">${esc(n.time)}</span><span class="nb-title">${esc(n.title)}</span></button>`;
  }
  function seatView() {
    const me = state.guests.find((g) => g.id === ui.meId);
    if (me) return placeCard(me);
    if (!state.guests.some((g) => g.name.trim())) {
      return '<p class="g-empty">Die Sitzordnung wird gerade vorbereitet. Schau etwas später noch einmal vorbei.</p>';
    }
    return `
      <p class="g-intro">${esc(state.event.welcome.trim() || 'Gib deinen Namen ein, dann zeigen wir dir deinen Tisch.')}</p>
      <label class="search" for="g-q"><span class="sr">Dein Name</span>${ICON.search}
        <input id="g-q" type="search" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search" placeholder="Vor- oder Nachname" value="${esc(ui.query)}">
      </label>
      <div id="g-results" aria-live="polite">${resultsHTML()}</div>`;
  }
  function resultsHTML() {
    const q = ui.query.trim();
    if (q.replace(/\s/g, '').length < 2) return '';
    const list = searchGuests(q);
    if (!list.length) return `<p class="g-none">Kein Eintrag für „${esc(q)}“. Prüfe die Schreibweise oder frag beim Eingang nach.</p>`;
    return `<ul class="results">${list.map((g) => {
      const t = tableById(g.tableId);
      const where = t ? `<span class="r-table">${esc(tableName(t))}${multiFloor() ? `<small>${esc(floorName(floorOf(t)))}</small>` : ''}</span>` : '<span class="r-table none">noch kein Tisch</span>';
      return `<li><button class="result" data-act="pick" data-id="${esc(g.id)}"><span class="r-name">${esc(g.name)}${g.count > 1 ? `<small>${g.count} Personen</small>` : ''}</span>${where}</button></li>`;
    }).join('')}</ul>`;
  }
  function placeCard(g) {
    const t = tableById(g.tableId);
    const mates = t && state.options.showTablemates
      ? state.guests.filter((o) => o.tableId === t.id && o.id !== g.id && o.name.trim()).sort((a, b) => natCmp(a.name, b.name)) : [];
    const isNumber = t && /^\d{1,3}[a-z]?$/i.test(t.label);
    const label = t ? (isNumber ? t.label : t.label || 'Tisch') : '';
    return `
      <article class="placecard${ui.reveal ? ' reveal' : ''}" aria-label="Deine Tischkarte">
        <div class="pc-in">
          <p class="pc-hello">Willkommen,</p>
          <h2 class="pc-name">${esc(g.name)}</h2>
          ${g.count > 1 ? `<p class="pc-count">für ${g.count} Personen</p>` : ''}
          ${PC_ORNAMENT}
          ${t ? `<p class="pc-label">Dein Tisch</p><p class="pc-num${isNumber ? '' : ' word'}">${esc(label)}</p>${multiFloor() ? `<p class="pc-floor">${esc(floorName(floorOf(t)))}</p>` : ''}`

      </article>

        <div class="plan-head"><h3>So findest du hin</h3>${zoomControls()}</div>

  }
  // Wegbeschreibung: ein Plan, oder zwei Schritte über Treppe/Lift
  function wayHTML(t) {
    const steps = wayFor(t);
    const plan = (st, label) => `<div class="plan-box g-plan">${planSVG({ floor: st.floor, hl: t.id, dim: true, hlObj: st.to.seats ? null : st.to.id, route: st.from ? { from: st.from, to: st.to } : null, zoom: ui.zoom, label })}</div>`;
    if (steps.length === 2) {
      const [a, b] = steps;
      return `<p class="step-title">1. ${esc(floorName(a.floor))}</p>${plan(a, 'Weg vom Eingang zur ' + objName(a.to))}
        <p class="plan-caption">Geh vom Eingang zur Markierung „${esc(objName(a.to))}“.</p>
        <p class="step-title">2. ${esc(floorName(b.floor))}</p>${plan(b, 'Weg zu deinem Tisch')}
        <p class="plan-caption">Von „${esc(objName(b.from))}“ führt die Linie zu deinem Tisch.</p>`;
    }
    const st = steps[0];
    const caption = !st.from ? 'Dein Tisch ist im Plan farbig markiert.'
      : st.from.type === 'entrance' ? 'Die gestrichelte Linie führt vom Eingang zu deinem Tisch.'
      : `Die Linie führt von „${esc(objName(st.from))}“ zu deinem Tisch.`;
    return `${multiFloor() ? `<p class="step-title">${esc(floorName(st.floor))}</p>` : ''}${plan(st, 'Saalplan mit deinem Tisch')}<p class="plan-caption">${caption}</p>`;
  }
  function zoomControls() {
    return `<div class="zoom" role="group" aria-label="Plan vergrößern"><button class="icon-btn" data-act="zoom" data-z="-1" aria-label="Verkleinern"${ui.zoom <= 1 ? ' disabled' : ''}>−</button><button class="icon-btn" data-act="zoom" data-z="1" aria-label="Vergrößern"${ui.zoom >= 3 ? ' disabled' : ''}>+</button></div>`;
  }
  function programView() {
    const items = sortedProgram().filter((p) => p.title.trim());
    const now = nowBallMin(), next = nextItem(), cur = currentItem();
    return `<h2 class="g-h2">Programm</h2><ol class="timeline">${items.map((p) => {
      const past = now != null && p.time && ballMin(p.time) <= now && !(cur && cur.id === p.id);
      const isNext = next && next.id === p.id, isCur = cur && cur.id === p.id;
      return `<li class="${past ? 'past' : ''}${isNext ? ' next' : ''}"><span class="tl-time">${esc(p.time)}</span><div><p class="tl-title">${esc(p.title)}${isNext ? '<span class="tag">Als Nächstes</span>' : ''}${isCur ? '<span class="tag now">Läuft gerade</span>' : ''}</p>${p.desc.trim() ? `<p class="tl-desc">${esc(p.desc)}</p>` : ''}</div></li>`;
    }).join('')}</ol>`;
  }
  function menuView() {
    const cats = state.menu.map((c) => ({ title: c.title, items: c.items.filter((i) => i.name.trim()) })).filter((c) => c.items.length);
    return `<h2 class="g-h2">Speisen & Getränke</h2>${cats.map((c) => `<section class="menu-cat"><h3>${esc(c.title || 'Karte')}</h3><ul class="menu-list">${c.items.map((i) => `<li><div class="mi-row"><span class="mi-name">${esc(i.name)}</span>${i.price.trim() ? `<span class="mi-dots" aria-hidden="true"></span><span class="mi-price">${esc(fmtPrice(i.price))}</span>` : ''}</div>${i.desc.trim() ? `<p class="mi-desc">${esc(i.desc)}</p>` : ''}</li>`).join('')}</ul></section>`).join('')}`;
  }
  function planView() {
    const me = state.guests.find((g) => g.id === ui.meId);
    const t = me ? tableById(me.tableId) : null;
    if (!state.floors.some((f) => f.id === ui.gFloor)) ui.gFloor = t ? t.floorId : state.floors[0].id;
    const f = floorById(ui.gFloor);
    const step = t ? wayFor(t).find((st) => st.floor.id === f.id) : null;
    const tabs = multiFloor() ? `<div class="seg g-floors" role="group" aria-label="Geschoss wählen">${state.floors.map((x) => `<button class="${x.id === f.id ? 'on' : ''}" data-act="gfloor" data-id="${esc(x.id)}" aria-pressed="${x.id === f.id}">${esc(floorName(x))}</button>`).join('')}</div>` : '';
    let caption = 'Such unter „Mein Platz“ nach deinem Namen, dann wird dein Tisch hier markiert.';
    if (t) caption = t.floorId === f.id ? `${esc(tableName(t))} ist farbig markiert.` : `${esc(tableName(t))} ist auf dem Plan „${esc(floorName(floorOf(t)))}“.`;
    return `<div class="plan-head"><h2 class="g-h2">Saalplan</h2>${zoomControls()}</div>${tabs}
      <div class="plan-box g-plan">${planSVG({ floor: f, hl: t ? t.id : null, dim: !!t, hlObj: step && !step.to.seats ? step.to.id : null, route: step && step.from ? { from: step.from, to: step.to } : null, zoom: ui.zoom })}</div>
      <p class="plan-caption">${caption}</p>`;
  }
  // Nach dem Vergrößern den eigenen Tisch in die Mitte scrollen
  function centerOnHighlight() {
    if (ui.zoom <= 1) return;
    document.querySelectorAll('.g-plan').forEach((box) => {
      const hl = box.querySelector('.hl') || box.querySelector('.hlz');
      if (!hl) return;
      const b = hl.getBoundingClientRect(), r = box.getBoundingClientRect();
      box.scrollLeft += b.left + b.width / 2 - (r.left + r.width / 2);
      box.scrollTop += b.top + b.height / 2 - (r.top + r.height / 2);
    });
  }

  // ===================================================================
  // 7. Verwaltung
  // ===================================================================
  const A_TABS = [['overview', 'Übersicht'], ['guests', 'Gäste'], ['plan', 'Saalplan'], ['program', 'Programm'], ['menu', 'Speisen & Getränke'], ['share', 'QR-Code'], ['settings', 'Einstellungen']];

  function renderAdmin() {
    const counts = { guests: state.guests.length, plan: state.tables.length, program: state.program.length, menu: state.menu.reduce((n, c) => n + c.items.length, 0) };

  function adminBanners() {
    let h = '';

      const at = new Date(ui.draft.at).toLocaleString('de-AT', { dateStyle: 'short', timeStyle: 'short' });
      const newer = ui.draft.base !== state.updatedAt ? ' Seitdem wurde allerdings eine neuere Version gespeichert.' : '';
      h += `<div class="banner"><div><strong>Es gibt ungespeicherte Änderungen vom ${esc(at)}.</strong>${newer}</div><div class="btn-row"><button class="btn small primary" data-act="draft-restore">Wiederherstellen</button><button class="btn small" data-act="draft-discard">Verwerfen</button></div></div>`;

      else if (gh.status && gh.status !== 'ok') h += `<div class="banner warn"><div>${esc(gh.status)}</div><button class="btn small" data-act="goto" data-tab="settings">Einstellungen</button></div>`;

  // ----- Übersicht -----
  function overviewTab() {
    const persons = sumPersons(), seats = state.tables.reduce((n, t) => n + t.seats, 0);
    const unassigned = state.guests.filter((g) => !g.tableId);
    const occ = occupancy();
    const over = state.tables.filter((t) => (occ[t.id] || 0) > t.seats).sort((a, b) => natCmp(a.label, b.label));
    const issues = [];
    if (state.isDemo) {
      issues.push('<li><span>Gäste, Programm und Karte sind noch Beispieldaten.</span><button class="btn small" data-act="demo-clear">Beispieldaten entfernen</button></li>');
    }
    if (unassigned.length) issues.push(`<li><span>${unassigned.length === 1 ? '1 Eintrag hat' : unassigned.length + ' Einträge haben'} noch keinen Tisch.</span><button class="btn small" data-act="goto" data-tab="guests" data-unassigned="1">Anzeigen</button></li>`);
    for (const t of over) issues.push(`<li><span>${esc(tableName(t))} ist überbelegt: ${occ[t.id]} Personen bei ${t.seats} Plätzen.</span><button class="btn small" data-act="goto" data-tab="plan" data-sel="${esc(t.id)}">Im Plan zeigen</button></li>`);
    if (persons > seats && state.tables.length) issues.push(`<li><span>Es gibt mehr Personen (${persons}) als Sitzplätze (${seats}).</span><button class="btn small" data-act="goto" data-tab="plan">Zum Saalplan</button></li>`);
    if (state.tables.length && !state.objects.some((o) => o.type === 'entrance')) issues.push('<li><span>Im Saalplan fehlt ein Eingang. Ohne Eingang sehen Gäste keinen Weg zu ihrem Tisch.</span><button class="btn small" data-act="goto" data-tab="plan">Zum Saalplan</button></li>');
    const entObj = state.objects.find((o) => o.type === 'entrance');
    if (entObj && multiFloor()) {
      const ef = floorOf(entObj);
      const hasConn = (f) => onFloor(state.objects, f).some((o) => CONNECT.includes(o.type));
      for (const f of state.floors) {
        if (f.id === ef.id || !onFloor(state.tables, f).length || onFloor(state.objects, f).some((o) => o.type === 'entrance')) continue;
        if (!hasConn(f)) issues.push(`<li><span>Im Plan „${esc(floorName(f))}“ fehlt eine Treppe oder ein Lift. Gäste sehen dort keinen Weg zu ihrem Tisch.</span><button class="btn small" data-act="goto" data-tab="plan" data-floor="${esc(f.id)}">Zum Plan</button></li>`);
        else if (!hasConn(ef)) issues.push(`<li><span>Im Plan „${esc(floorName(ef))}“ fehlt eine Treppe oder ein Lift. Gäste für „${esc(floorName(f))}“ sehen sonst nicht, wie sie vom Eingang hinkommen.</span><button class="btn small" data-act="goto" data-tab="plan" data-floor="${esc(ef.id)}">Zum Plan</button></li>`);
      }
    }
    if (!state.event.guestUrl.trim()) issues.push('<li><span>Für den QR-Code fehlt noch der Link zur Gäste-Seite.</span><button class="btn small" data-act="goto" data-tab="share">Link eintragen</button></li>');
    return `
      <h1 class="a-h">Übersicht</h1>

      <dl class="stats">

        <div><dt>Personen</dt><dd>${persons}</dd></div>

      <section class="a-sec"><h2>Zu erledigen</h2>${issues.length ? `<ul class="issues">${issues.join('')}</ul>` : '<p class="ok-line">Alles bereit. Gäste können ihren Platz finden.</p>'}</section>
      <section class="a-sec"><h2>Saalplan mit Belegung</h2>${state.floors.map((f) => `${multiFloor() ? `<h3 class="floor-h">${esc(floorName(f))}</h3>` : ''}<div class="plan-box small">${planSVG({ floor: f, occ: true, label: 'Saalplan ' + floorName(f) })}</div>`).join('')}</section>`;
  }

  // ----- Gäste -----
  function guestsTab() {

    return `
      <h1 class="a-h">Gäste</h1>

  function importPanel() {

  function parseImport(text) {
    const lines = String(text || '').replace(/^\ufeff/, '').split(/\r?\n/).filter((l) => l.trim());
    if (!lines.length) return { rows: [], skipped: 0 };
    const delim = lines.some((l) => l.includes('\t')) ? '\t' : lines.some((l) => l.includes(';')) ? ';' : ',';
    let cells = lines.map((l) => l.split(delim).map((c) => c.trim().replace(/^"(.*)"$/, '$1').replace(/""/g, '"').trim()));
    let col = { name: 0, first: -1, last: -1, table: 1, count: 2 };
    // Kopfzeile nur, wenn eine Zelle genau ein Spaltenname ist (sonst wäre „Gastl“ eine Kopfzeile)
    const HEAD = {
      name: ['name', 'namen', 'gast', 'gaste', 'gastname', 'vollername'], first: ['vorname'], last: ['nachname', 'familienname', 'zuname'],
      table: ['tisch', 'tischnr', 'tischnummer', 'table', 'platz'], count: ['personen', 'anzahl', 'pers', 'anzahlpersonen', 'personenanzahl'],
    };
    const head = cells[0].map((c) => canon(c).replace(/[^a-z]/g, ''));
    const find = (key) => head.findIndex((h) => HEAD[key].includes(h));
    if (Object.keys(HEAD).some((k) => find(k) >= 0)) {
      col = { name: find('name'), first: find('first'), last: find('last'), table: find('table'), count: find('count') };
      cells = cells.slice(1);
    }
    const rows = [];
    let skipped = 0;
    for (const c of cells) {
      let name = col.name >= 0 ? c[col.name] || '' : '';
      if (!name && (col.first >= 0 || col.last >= 0)) name = [col.first >= 0 ? c[col.first] : '', col.last >= 0 ? c[col.last] : ''].join(' ');
      name = name.replace(/\s+/g, ' ').trim();
      if (!name) { skipped++; continue; }
      const table = col.table >= 0 ? String(c[col.table] || '').replace(/^tisch\s*/i, '').trim() : '';
      const count = col.count >= 0 ? parseInt(c[col.count], 10) : NaN;
      rows.push({ name: name.slice(0, 120), table: table.slice(0, 30), count: Number.isFinite(count) && count > 0 ? Math.min(count, 50) : 1 });
    }
    return { rows, skipped };
  }
  function importPreviewHTML() {
    const { rows, skipped } = parseImport(ui.importText);
    if (!rows.length) return ui.importText.trim() ? '<p class="muted">In diesem Text wurde kein Name erkannt.</p>' : '';
    const known = new Set(state.tables.map((t) => canon(t.label)));
    const fresh = [];
    for (const r of rows) if (r.table && !known.has(canon(r.table))) { known.add(canon(r.table)); fresh.push(r.table); }
    return `<p class="import-sum">${rows.length} ${rows.length === 1 ? 'Eintrag' : 'Einträge'} erkannt${fresh.length ? `, ${fresh.length === 1 ? '1 neuer Tisch wird' : fresh.length + ' neue Tische werden'} angelegt (${fresh.slice(0, 8).map(esc).join(', ')}${fresh.length > 8 ? ' …' : ''})` : ''}.${skipped ? ` ${skipped === 1 ? '1 Zeile ohne Namen wird' : skipped + ' Zeilen ohne Namen werden'} übersprungen.` : ''}</p>

  // Ziehen mit Maus, Finger oder Stift
  let drag = null;
  function svgPoint(svg, e) {

    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function onPointerDown(e) {
    const box = e.target.closest && e.target.closest('#plan-box');
    if (!box || ui.mode !== 'admin' || e.button > 0) return;
    const svg = box.querySelector('svg');
    const g = e.target.closest('[data-item]');
    if (!g) { if (ui.sel) { ui.sel = null; refreshPlan(); } return; }
    const found = findItem(g.dataset.item);
    if (!found) return;
    e.preventDefault();
    const p = svgPoint(svg, e);
    drag = { id: found.item.id, ox: p.x - found.item.x, oy: p.y - found.item.y, snapshot: JSON.stringify(state), moved: false, pid: e.pointerId };
    try { box.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
    if (ui.sel !== found.item.id) { ui.sel = found.item.id; refreshPlan(); }
  }
  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const box = document.getElementById('plan-box');
    const svg = box && box.querySelector('svg');
    const found = findItem(drag.id);
    if (!svg || !found) return;
    const it = found.item, p = svgPoint(svg, e), step = ui.snap ? 5 : 1, f = floorOf(it);
    const x = clamp(Math.round((p.x - drag.ox) / step) * step, it.w / 2, f.w - it.w / 2);
    const y = clamp(Math.round((p.y - drag.oy) / step) * step, it.h / 2, f.h - it.h / 2);
    if (x !== it.x || y !== it.y) { it.x = x; it.y = y; drag.moved = true; box.innerHTML = editorSVG(); }
  }
  function onPointerUp(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    if (drag.moved) {
      undoStack.push(drag.snapshot);
      if (undoStack.length > 80) undoStack.shift();
      undoKey = null;
      afterChange(false);

  function qrMatrix(text) {
    if (typeof qrcode !== 'function') return null;
    try {
      if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
      const q = qrcode(0, 'Q');
      q.addData(text);
      q.make();

    } catch (e) { return null; }
  }
  function qrSvg(m) {
    const quiet = 4, size = m.n + quiet * 2;
    let d = '';
    for (let r = 0; r < m.n; r++) for (let c = 0; c < m.n; c++) if (m.dark(r, c)) d += `M${c + quiet} ${r + quiet}h1v1h-1z`;
    return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="QR-Code zur Gäste-Seite"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  function qrAreaHTML() {
    const url = state.event.guestUrl.trim();
    if (!url) return '<p class="muted">Sobald der Link eingetragen ist, erscheint hier der QR-Code.</p>';
    if (!validUrl(url)) return '<p class="muted">Das sieht noch nicht wie ein vollständiger Link aus. Er beginnt mit https://</p>';
    const m = qrMatrix(url);
    if (!m) return '<p class="muted">Für diesen Link konnte kein QR-Code erzeugt werden. Ist er vielleicht sehr lang?</p>';
    return `${isDirty() ? '<div class="banner warn"><div>Du hast ungespeicherte Änderungen. Speichere, damit Gäste den aktuellen Stand sehen.</div></div>' : ''}
      <div class="qr-wrap">
        <figure class="poster-prev"><p class="pp-title">${esc(state.event.name || 'Willkommen')}</p><div class="pp-qr">${qrSvg(m)}</div><p class="pp-text">Scanne den Code und finde deinen Tisch</p></figure>
        <div class="qr-actions">
          <button class="btn primary" data-act="qr-poster">Aushang herunterladen (A4)</button>
          <button class="btn" data-act="qr-png">Nur QR-Code herunterladen</button>
          <button class="btn" data-act="qr-print">Aushang drucken</button>
          <button class="btn" data-act="qr-copy">Link kopieren</button>
        </div>
      </div>`;
  }
  function drawQR(ctx, m, x, y, size) {
    const quiet = 4, cells = m.n + quiet * 2, s = Math.floor(size / cells), real = s * cells;
    const ox = Math.round(x + (size - real) / 2), oy = Math.round(y + (size - real) / 2);
    ctx.fillStyle = '#fff'; ctx.fillRect(ox, oy, real, real);
    ctx.fillStyle = '#000';
    for (let r = 0; r < m.n; r++) for (let c = 0; c < m.n; c++) if (m.dark(r, c)) ctx.fillRect(ox + (c + quiet) * s, oy + (r + quiet) * s, s, s);
  }
  async function fontsReady() {
    if (!document.fonts || !document.fonts.load) return;
    try {
      await Promise.race([
        Promise.all(['600 80px "Bodoni Moda"', 'italic 500 60px "Bodoni Moda"', '400 40px "Jost"'].map((f) => document.fonts.load(f))),
        new Promise((r) => setTimeout(r, 2500)),

    } catch (e) { /* Ersatzschrift */ }
  }
  const canvasBlob = (c) => new Promise((res) => c.toBlob(res, 'image/png'));
  function wrapLines(ctx, text, maxW) {
    const words = String(text).split(/\s+/).filter(Boolean), lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
    }
    if (line) lines.push(line);
    if (lines.length === 2 && words.length > 2) {
      // Zwei ausgewogene Zeilen statt einer langen und einer kurzen
      let best = lines, bestW = Infinity;
      for (let i = 1; i < words.length; i++) {
        const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
        const w = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
        if (w <= maxW && w < bestW) { bestW = w; best = [a, b]; }
      }
      return best;
    }
    return lines;
  }
  async function posterCanvas() {
    const url = state.event.guestUrl.trim(), m = qrMatrix(url);

    await fontsReady();
    const W = 1240, H = 1754, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    const serif = '"Bodoni Moda", "Bodoni 72", Didot, Georgia, serif', sans = 'Jost, Futura, "Century Gothic", Arial, sans-serif';
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#A8844C'; x.lineWidth = 3; x.strokeRect(58, 58, W - 116, H - 116);
    x.lineWidth = 1.5; x.strokeRect(76, 76, W - 152, H - 152);
    x.textAlign = 'center'; x.fillStyle = '#18213D';
    let fs = 112, lines;
    do { x.font = `600 ${fs}px ${serif}`; lines = wrapLines(x, state.event.name || 'Willkommen', W - 280); fs -= 6; } while ((lines.length > 3 || lines.some((l) => x.measureText(l).width > W - 280)) && fs > 40);
    fs += 6;
    let y = 250;
    for (const l of lines) { x.fillText(l, W / 2, y); y += fs * 1.08; }
    const { when, where } = eventLines();
    x.font = `400 38px ${sans}`; x.fillStyle = '#596079';
    if (when) { y += 10; x.fillText(when, W / 2, y); y += 50; }
    if (where) { x.fillText(where, W / 2, y); y += 50; }
    y += 20;
    x.strokeStyle = '#A8844C'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(W / 2 - 170, y); x.lineTo(W / 2 - 34, y); x.moveTo(W / 2 + 34, y); x.lineTo(W / 2 + 170, y); x.stroke();
    x.beginPath(); x.moveTo(W / 2, y - 12); x.lineTo(W / 2 + 12, y); x.lineTo(W / 2, y + 12); x.lineTo(W / 2 - 12, y); x.closePath(); x.stroke();
    const qrSize = Math.min(760, H - y - 330);
    drawQR(x, m, (W - qrSize) / 2, y + 40, qrSize);
    let ty = y + 40 + qrSize + 95;
    x.fillStyle = '#18213D'; x.font = `italic 500 62px ${serif}`;
    x.fillText('Scanne den Code', W / 2, ty);
    x.font = `400 40px ${sans}`; x.fillStyle = '#596079';
    x.fillText('und finde deinen Tisch', W / 2, ty + 60);
    return c;
  }

  async function save() {

    if (ui.readOnly) { toast('Diese Ansicht darf nicht speichern.'); return; }
    ui.saving = true; renderSaveBar();
    const next = JSON.parse(JSON.stringify(state));
    next.updatedAt = new Date().toISOString();
    store.set(DRAFT_KEY, { base: state.updatedAt, at: Date.now(), state, pending: next.updatedAt });
    store.set(UI_KEY, { mode: 'admin', aTab: ui.aTab, justSaved: true }, 'session');
    let attempt = 0;
    for (;;) {
      try {
        await caps.artifact.publish(buildDocument(next));
        // Normalerweise lädt die Seite jetzt neu. Falls nicht, hier weiter:
        state = normalizeState(next); published = JSON.stringify(state);

        store.del(UI_KEY, 'session');
        store.set(DRAFT_KEY, { base: state.updatedAt, at: Date.now(), state });
        if (code === 'conflict') toast('Inzwischen hat jemand anderer gespeichert. Die neueste Version wird geladen, deine Änderungen kannst du danach wiederherstellen.', { ms: 9000 });
        else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].includes(code)) { ui.readOnly = true; render(); toast('Diese Ansicht darf nicht speichern.'); }

  function b64encode(text) {
